<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Pixel notepad icon -->
  <rect x="4" y="2" width="16" height="20" rx="1" fill="#313244" stroke="#6030ff" stroke-width="1.5"/>
  <!-- Spine binding dots -->
  <rect x="4" y="6"  width="2" height="2" fill="#6030ff"/>
  <rect x="4" y="11" width="2" height="2" fill="#6030ff"/>
  <rect x="4" y="16" width="2" height="2" fill="#6030ff"/>
  <!-- Lines -->
  <rect x="8" y="7"  width="10" height="1" fill="#8866ff"/>
  <rect x="8" y="10" width="10" height="1" fill="#8866ff"/>
  <rect x="8" y="13" width="8"  height="1" fill="#8866ff"/>
  <rect x="8" y="16" width="6"  height="1" fill="#8866ff"/>
  <!-- Pixel cursor blink -->
  <rect x="14" y="16" width="2" height="2" fill="#cdd6f4"/>
</svg>
