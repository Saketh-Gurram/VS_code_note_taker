<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

  <!-- Drop shadow -->
  <rect x="5" y="4" width="14" height="18" rx="2" fill="#000" opacity="0.25"/>

  <!-- Page body — light cream so it pops against the dark sidebar -->
  <rect x="4" y="3" width="14" height="18" rx="2" fill="#e8e4d8"/>

  <!-- Purple binding strip on the left -->
  <rect x="4" y="3" width="4" height="18" rx="2" fill="#6030ff"/>
  <!-- Binding right edge shadow -->
  <rect x="7" y="3" width="1" height="18" fill="#4020cc"/>

  <!-- Binding holes (dark punched circles) -->
  <rect x="5" y="6"  width="2" height="2" rx="1" fill="#1e1e2e"/>
  <rect x="5" y="11" width="2" height="2" rx="1" fill="#1e1e2e"/>
  <rect x="5" y="16" width="2" height="2" rx="1" fill="#1e1e2e"/>

  <!-- Ruled text lines -->
  <rect x="9" y="7"  width="7" height="1.5" rx="0.5" fill="#9090b8"/>
  <rect x="9" y="10" width="7" height="1.5" rx="0.5" fill="#9090b8"/>
  <rect x="9" y="13" width="5" height="1.5" rx="0.5" fill="#9090b8"/>
  <rect x="9" y="16" width="3" height="1.5" rx="0.5" fill="#9090b8"/>

  <!-- Blinking pixel cursor -->
  <rect x="9" y="19" width="2" height="2" fill="#8866ff"/>

  <!-- Pencil (bottom-right corner) -->
  <rect x="17" y="13" width="3" height="8" rx="1" fill="#f9e2af"/>
  <!-- Eraser cap -->
  <rect x="17" y="13" width="3" height="2" rx="1" fill="#f38ba8"/>
  <!-- Pencil tip (wood) -->
  <rect x="17" y="19" width="3" height="1" fill="#c8a060"/>
  <!-- Lead point -->
  <rect x="18" y="20" width="1" height="1" fill="#1e1e2e"/>

</svg>
